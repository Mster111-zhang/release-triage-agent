[project]
name = "release-triage-agent"
version = "0.1.0"
description = "基于可核对证据的发布故障排查 Agent"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.146.0",
    "httpx==0.28.1",
    "langgraph==1.2.16",
    "uvicorn==0.54.0",
]

[project.scripts]
release-triage = "release_triage.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["release_triage"]
